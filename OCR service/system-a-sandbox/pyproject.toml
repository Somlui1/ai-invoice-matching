[project]
name = "system-a"
version = "1.0.0"
description = "AIVA System A — Document Intelligence & Validation Engine (Standard v6.6)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "PyYAML>=6", "pymupdf>=1.24"]

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
system-a = "system_a.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
