# Standard v6.6 Table 6 tolerances + Decision Log v1.3 §7.1 provisional thresholds
tolerance:
  line_math: "0.50"
  total: "0.50"
  vat: "1.00"
  vat_rate: "0.07"
  price_exact: "0.005"
  price_pct: "0.01"
  price_abs: "200"
oracle:
  row_cap: 50
  max_queries_per_round: 4           # AIVA-SYSA-ORA-01 — worst case per validation round (see oracle_lookup)
  lookup:
    mode: tax_invoice                # legacy_po_invoice (RCV-V01 -> PO-SUPPLIER -> RCV-V02) | tax_invoice
    invoice_match_columns: [SHIPMENT_NUM, PACKING_SLIP, WAYBILL_AIRBILL_NUM]
    # Variants of one invoice number, generated from config (never hardcoded in code) and then filtered
    # by the SQL whitelist.  Table 12 #3: receipts store the number in different spellings.
    invoice_variants:
      - {type: strip_char, char: "/"}
      - {type: insert_after_prefix, prefix: "SQ26", insert: "/"}
    use_ocr_supplier_tax_id: true    # OCR Tax ID first (checksum must pass), Oracle PO lookup as fallback
    po_list_fallback: true           # last hop: search by PO when the invoice number matches nothing
validation:
  multi_po_receipts: false           # AIVA-SYSA-ORA-01 — waiting for the Standard owner's approval
  v09_compare_matched_only: false    # AIVA-SYSA-ORA-01 — waiting for the Standard owner's approval
required_fields: [invoice_num, po_number, customer_name, customer_address, customer_tax_id, sub_total, vat, grand_total]
required_line_cells: [qty, uom, unit_price, amount]
confidence:            # OQ-09 provisional — recalibrate from eval set
  key:     {fields: [invoice_num, po_number, customer_tax_id], min: 0.95, require_agreement: true}
  money:   {fields: [sub_total, vat, grand_total, qty, unit_price, amount], min: 0.90, require_agreement: true}
  text:    {fields: [customer_name, customer_address], min: 0.80, require_agreement: false}
  uom:     {fields: [uom], min: 0.85, require_agreement: false}
  optional: {fields: [supplier_name, supplier_tax_id, invoice_date, release_num, description, currency, item_code], min: 0.70, require_agreement: false}
signature:
  min_confidence: 0.80          # 2026-10-07: 28/98 docs at 0.80 (deliverer) went to MANUAL_REVIEW at 0.85
ai:
  v05_name_min_confidence: 0.85
  v05_address_ai_enabled: true
  v07_min_confidence: 0.80     # Table 6 part 2: < 0.80 = E13
  v08_votes: 3
  v08_consistency_guard: true

# Evidence-based acceptance (domain/evidence.py) — 2026-10-07, from the 98-document Paperless run.
# A value that failed reader agreement / confidence is still trusted when something independent
# confirms it.  Every switch defaults to false when absent; set false to get the previous behaviour.
evidence:
  collapse_repeated_copies: true      # original+copy pages read twice: k identical blocks, sum = k x sub_total
  arithmetic: true                    # B: qty*price=amount, sum(amount)=sub_total, sub+vat=grand
  oracle: true                        # C: invoice/PO/Tax ID found in Oracle; matched line price/qty/amount
  uom_from_number_cells: true         # "23,100.00 /PC", "2 PCS" -> unit taken from the same cell
  uom_inherit_from_receipt: true      # no/unknown unit on the invoice -> unit of the matched receipt line
  derive_qty_from_amount: true        # weight-billed line: amount/unit_price == receipt qty -> qty
  customer_identity_by_tax_id: true   # D: unconfirmed customer name/address covered by an Oracle Tax ID
  customer_name_advisory: true
  deliverer_from_stamp: true         # deliverer slot undecided + company stamp region on an invoice page        # Tax ID + address match -> name mismatch is audit data, not E07/manual
